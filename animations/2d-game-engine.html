<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Game Engine</title>
<style>
    :root {
        --bg: #000000;
        --line: #919191;
        --dim: #30363d;
        --signal: #58A6FF;
        --accent: #ffe600;
        --warn: #f88d00;
        --ok: #3FB950;
        --cycle: 8s;            
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        color: var(--line);
        font-family: monospace;
    }

    .scene {
        width: 280px;
    }

    .scene svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
    }

    .stroke {
        fill: none;
        stroke: var(--line);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .thin { stroke-width: 1; }
    .dim  { stroke: var(--dim); }

    text {
        font-family: monospace;
        fill: var(--line);
        font-size: 7px;
    }


    .overworld, .state-overworld {
        animation: show-overworld var(--cycle) steps(1) infinite;
    }

    .battle, .state-battle {
        opacity: 0;
        animation: show-battle var(--cycle) steps(1) infinite;
    }

    @keyframes show-overworld { 0% { opacity: 1; } 50% { opacity: 0; } 98% { opacity: 1; } }
    @keyframes show-battle    { 0% { opacity: 0; } 50% { opacity: 1; } 98% { opacity: 0; } }

    .state-overworld { fill: var(--signal); }
    .state-battle    { fill: var(--warn); }

    .flash {
        fill: #ffffff;
        opacity: 0;
        animation: flash var(--cycle) infinite;
    }

    @keyframes flash {
        0%, 45%   { opacity: 0; }
        46%       { opacity: 0.7; }
        47%       { opacity: 0; }
        48%       { opacity: 0.7; }
        49.5%     { opacity: 0.9; }
        51%, 100% { opacity: 0; }
    }

    .player {
        animation: walk var(--cycle) linear infinite;
    }

    @keyframes walk {
        0%, 4%    { transform: translate(0, 0); }
        18%, 26%  { transform: translate(30px, 0); }
        29%       { transform: translate(30px, -6px); }   
        32%, 36%  { transform: translate(30px, 0); }
        46%, 100% { transform: translate(75px, 0); }
    }

    .bob {
        animation: bob 0.3s steps(2) infinite;
    }

    @keyframes bob {
        50% { transform: translateY(-1px); }
    }

    .blocked {
        fill: var(--warn);
        font-size: 9px;
        font-weight: bold;
        opacity: 0;
        animation: blocked var(--cycle) steps(1) infinite;
    }

    @keyframes blocked { 0% { opacity: 0; } 28% { opacity: 1; } 36% { opacity: 0; } }

    .tree-hit {
        animation: tree-hit var(--cycle) infinite;
    }

    @keyframes tree-hit {
        0%, 28%, 33%, 100% { stroke: var(--line); }
        29%, 32%           { stroke: var(--warn); }
    }

    .hp {
        transform-box: fill-box;
        transform-origin: left center;
    }

    .hp.enemy {
        fill: var(--ok);
        animation: hp-enemy var(--cycle) infinite;
    }

    .hp.me {
        fill: var(--ok);
        animation: hp-me var(--cycle) infinite;
    }

    @keyframes hp-enemy {
        0%, 61%   { transform: scaleX(1);    fill: var(--ok); }
        64%, 76%  { transform: scaleX(0.4);  fill: var(--warn); }
        79%, 100% { transform: scaleX(0);    fill: var(--warn); }
    }

    @keyframes hp-me {
        0%, 69%   { transform: scaleX(1); }
        72%, 100% { transform: scaleX(0.75); }
    }

    .shot {
        opacity: 0;
    }

    .shot.s1 { fill: var(--signal); animation: shot-1 var(--cycle) infinite; }
    .shot.s2 { fill: var(--warn);   animation: shot-2 var(--cycle) infinite; }
    .shot.s3 { fill: var(--signal); animation: shot-3 var(--cycle) infinite; }

    @keyframes shot-1 {
        0%, 57%   { opacity: 0; transform: translate(0, 0); }
        57.5%     { opacity: 1; transform: translate(0, 0); }
        61%       { opacity: 1; transform: translate(96px, -30px); }
        61.5%, 100% { opacity: 0; transform: translate(96px, -30px); }
    }

    @keyframes shot-2 {
        0%, 66%   { opacity: 0; transform: translate(0, 0); }
        66.5%     { opacity: 1; transform: translate(0, 0); }
        70%       { opacity: 1; transform: translate(-96px, 30px); }
        70.5%, 100% { opacity: 0; transform: translate(-96px, 30px); }
    }

    @keyframes shot-3 {
        0%, 73%   { opacity: 0; transform: translate(0, 0); }
        73.5%     { opacity: 1; transform: translate(0, 0); }
        77%       { opacity: 1; transform: translate(96px, -30px); }
        77.5%, 100% { opacity: 0; transform: translate(96px, -30px); }
    }

    .creature {
        animation: creature var(--cycle) infinite;
    }

    @keyframes creature {
        0%, 61%   { opacity: 1; transform: translateY(0); }
        62%       { opacity: 0.2; }
        63%       { opacity: 1; }
        77%       { opacity: 1; transform: translateY(0); }
        78%       { opacity: 0.2; }
        79%       { opacity: 1; transform: translateY(0); }
        83%, 100% { opacity: 0; transform: translateY(8px); }
    }

    .hero {
        animation: hero var(--cycle) infinite;
    }

    @keyframes hero {
        0%, 70%, 72%, 100% { opacity: 1; }
        71%                { opacity: 0.2; }
    }

    .win {
        fill: var(--ok);
        font-size: 11px;
        font-weight: bold;
        text-anchor: middle;
        opacity: 0;
        animation: win var(--cycle) steps(1) infinite;
    }

    @keyframes win { 0% { opacity: 0; } 83% { opacity: 1; } 98% { opacity: 0; } }

    .cursor-fight {
        fill: var(--accent);
        animation: blink 0.5s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .label {
        position: relative;
        height: 1.4em;
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
    }

    .label span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: step var(--cycle) infinite;
    }

    .label span:nth-child(2) { animation-delay: calc(var(--cycle) * 0.25); }
    .label span:nth-child(3) { animation-delay: calc(var(--cycle) * 0.5); }
    .label span:nth-child(4) { animation-delay: calc(var(--cycle) * 0.75); color: var(--ok); }

    @keyframes step {
        0%        { opacity: 0; }
        3%, 21%   { opacity: 1; }
        25%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .overworld, .state-overworld, .battle, .state-battle, .flash, .player, .bob,
        .blocked, .tree-hit, .hp, .shot, .creature, .hero, .win, .cursor-fight, .label span {
            animation: none;
        }
        .battle, .state-battle, .flash, .blocked, .shot, .win { opacity: 0; }
        .label span:nth-child(1) { opacity: 1; }
    }
</style>
</head>
<body>

<div class="scene" role="img" aria-label="A small 2D game: the player walks on a tile map, bumps into a tree, enters tall grass and wins a turn-based battle.">

    <svg viewBox="0 0 280 120" aria-hidden="true">
        <defs>
            <pattern id="grass" x="50" y="16" width="15" height="15" patternUnits="userSpaceOnUse">
                <path d="M4 10 l1 -2 l1 2 M10 5 l1 -2 l1 2" fill="none" stroke="#30363d" stroke-width="1"/>
            </pattern>
            <pattern id="tall-grass" x="50" y="16" width="15" height="15" patternUnits="userSpaceOnUse">
                <path d="M2 13 l2 -7 l2 7 M7 13 l2 -9 l2 9 M11 13 l2 -6 l2 6" fill="none" stroke="#3FB950" stroke-width="1" opacity="0.7"/>
            </pattern>
            <clipPath id="screen">
                <rect x="50" y="16" width="180" height="90" rx="3"/>
            </clipPath>
        </defs>

        <text class="state-overworld" x="50" y="11">STATE: OVERWORLD</text>
        <text class="state-battle"    x="50" y="11">STATE: BATTLE</text>

        <g clip-path="url(#screen)">

            <g class="overworld">
                <rect x="50" y="16" width="180" height="90" fill="url(#grass)"/>
                <!-- zone de hautes herbes (colonnes 5 à 7, lignes 3 à 5) -->
                <rect x="125" y="61" width="45" height="45" fill="url(#tall-grass)"/>

                <g class="stroke thin">
                    <circle cx="57.5" cy="27" r="6"/><line x1="57.5" y1="33" x2="57.5" y2="37"/>
                    <circle cx="177.5" cy="27" r="6"/><line x1="177.5" y1="33" x2="177.5" y2="37"/>
                    <circle cx="207.5" cy="72" r="6"/><line x1="207.5" y1="78" x2="207.5" y2="82"/>
                </g>
                <g class="stroke thin tree-hit">
                    <circle cx="102.5" cy="67" r="6"/><line x1="102.5" y1="73" x2="102.5" y2="76"/>
                </g>
                <path class="stroke thin" d="M146 30 l4 -5 l7 1 l3 5 Z"/>

                <g class="player">
                    <g class="bob">
                        <rect x="55" y="78" width="7" height="6" fill="#ffffff"/>
                        <rect x="56" y="80" width="2" height="2" fill="#000"/>
                        <rect x="54" y="84" width="9" height="5" fill="#58A6FF"/>
                        <rect x="55" y="89" width="3" height="2" fill="#919191"/>
                        <rect x="59" y="89" width="3" height="2" fill="#919191"/>
                    </g>
                    <text class="blocked" x="64" y="76">✕</text>
                </g>
            </g>

            <g class="battle">
                <text x="58" y="28">WILD BLOB  Lv5</text>
                <rect class="stroke thin dim" x="58" y="31" width="50" height="4" rx="1"/>
                <rect class="hp enemy" x="58" y="31" width="50" height="4" rx="1"/>

                <ellipse cx="190" cy="57" rx="16" ry="3" fill="#30363d"/>
                <g class="creature">
                    <path class="stroke" d="M176 55 Q176 34 190 34 Q204 34 204 55 Z"/>
                    <line class="stroke thin" x1="184" y1="35" x2="181" y2="28"/>
                    <line class="stroke thin" x1="196" y1="35" x2="199" y2="28"/>
                    <rect x="184" y="42" width="3" height="4" fill="#ffffff"/>
                    <rect x="193" y="42" width="3" height="4" fill="#ffffff"/>
                </g>

                <ellipse cx="90" cy="88" rx="16" ry="3" fill="#30363d"/>
                <g class="hero">
                    <rect x="83" y="64" width="14" height="11" fill="#ffffff"/>
                    <rect x="80" y="75" width="20" height="12" fill="#58A6FF"/>
                </g>

                <text x="150" y="74">YOU  Lv7</text>
                <rect class="stroke thin dim" x="150" y="77" width="50" height="4" rx="1"/>
                <rect class="hp me" x="150" y="77" width="50" height="4" rx="1"/>

                <circle class="shot s1" cx="94" cy="68" r="3"/>
                <circle class="shot s2" cx="190" cy="40" r="3"/>
                <circle class="shot s3" cx="94" cy="68" r="3"/>

                <line class="stroke thin dim" x1="50" y1="93" x2="230" y2="93"/>
                <text class="cursor-fight" x="58" y="102">▸</text>
                <text x="65" y="102">FIGHT</text>
                <text x="105" y="102">ITEM</text>
                <text x="140" y="102">RUN</text>

                <text class="win" x="190" y="50">YOU WIN!</text>
            </g>

            <rect class="flash" x="50" y="16" width="180" height="90"/>
        </g>

        <rect class="stroke" x="50" y="16" width="180" height="90" rx="3"/>
    </svg>

    <div class="label">
        <span>player movement</span><span>collision detection</span><span>turn-based battle</span><span>victory ✓</span>
    </div>
</div>

</body>
</html>
