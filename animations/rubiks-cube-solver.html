<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubik's Cube Solver</title>
<style>
    /* Couleurs reprises de css/terminal.css */
    :root {
        --bg: #000000;
        --line: #919191;
        --dim: #30363d;
        --signal: #58A6FF;
        --accent: #ffe600;
        --ok: #3FB950;
        --cycle: 8s;            /* durée d'un cycle complet (4 étapes de 2 s) */

        /* couleurs des cases du cube */
        --c-green:  #3FB950;
        --c-blue:   #58A6FF;
        --c-yellow: #ffe600;
        --c-orange: #f88d00;
        --c-red:    #ff5f56;
        --c-white:  #e6e6e6;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        color: var(--line);
        font-family: monospace;
    }

    .scene {
        width: 280px;
    }

    .scene svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
    }

    .stroke {
        fill: none;
        stroke: var(--line);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .thin { stroke-width: 1; }
    .dim  { stroke: var(--dim); }

    text {
        font-family: monospace;
        fill: var(--line);
        text-anchor: middle;
        font-size: 8px;
    }

    /* ---------- Étape 1 : commande depuis le smartphone en Bluetooth ---------- */

    .solve-btn {
        animation: tap var(--cycle) steps(1) infinite;
    }

    @keyframes tap {
        0%  { stroke: var(--line); }
        4%  { stroke: var(--signal); }
        25% { stroke: var(--line); }
    }

    .bt-waves {
        opacity: 0;
        animation: bt var(--cycle) infinite;
    }

    @keyframes bt {
        0%, 4%    { opacity: 0; }
        7%, 22%   { opacity: 1; }
        26%, 100% { opacity: 0; }
    }

    .wave {
        stroke: var(--signal);
        animation: wave 0.8s ease-out infinite;
    }

    .wave.w2 { animation-delay: 0.27s; }
    .wave.w3 { animation-delay: 0.53s; }

    @keyframes wave {
        0%   { opacity: 1; }
        100% { opacity: 0; }
    }

    /* ---------- Étape 2 : algorithme de résolution en C ---------- */

    .chip {
        animation: compute var(--cycle) infinite;
    }

    @keyframes compute {
        0%, 25%, 52%, 100% { stroke: var(--line); }
        28%, 48%           { stroke: var(--signal); }
    }

    .moves tspan {
        fill: var(--accent);
        opacity: 0;
        animation: var(--cycle) steps(1) infinite;
    }

    .moves .m1 { animation-name: move-1; }
    .moves .m2 { animation-name: move-2; }
    .moves .m3 { animation-name: move-3; }
    .moves .m4 { animation-name: move-4; }

    @keyframes move-1 { 0% { opacity: 0; } 29% { opacity: 1; } 97% { opacity: 0; } }
    @keyframes move-2 { 0% { opacity: 0; } 34% { opacity: 1; } 97% { opacity: 0; } }
    @keyframes move-3 { 0% { opacity: 0; } 39% { opacity: 1; } 97% { opacity: 0; } }
    @keyframes move-4 { 0% { opacity: 0; } 44% { opacity: 1; } 97% { opacity: 0; } }

    /* ---------- Étape 3 : les moteurs pas à pas tournent la face ---------- */

    .wire {
        fill: none;
        stroke: var(--signal);
        stroke-width: 1.5;
        stroke-dasharray: 3 4;
        opacity: 0.25;
        animation: data 0.6s linear infinite, drive var(--cycle) steps(1) infinite;
    }

    @keyframes data { to { stroke-dashoffset: -7; } }

    @keyframes drive {
        0%  { opacity: 0.25; }
        51% { opacity: 1; }
        76% { opacity: 0.25; }
    }

    .rotor {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin var(--cycle) ease-in-out infinite;
    }

    @keyframes spin {
        0%, 51%   { transform: rotate(0deg); }
        76%, 100% { transform: rotate(720deg); }
    }

    /* La face du cube tourne d'un quart de tour (à peine) à chaque mouvement */
    .face {
        transform-box: fill-box;
        transform-origin: center;
        animation: twist var(--cycle) infinite;
    }

    @keyframes twist {
        0%, 54%, 58%, 61%, 65%, 68%, 72%, 75%, 100% { transform: rotate(0deg); }
        56%, 63%, 70%                               { transform: rotate(-8deg); }
    }

    /* Couleurs des 9 cases : mélangée → résolue (générées) */
    .st {
        animation: var(--cycle) steps(1) infinite;
    }

    @keyframes s1 { 0% { fill: var(--c-red); } 56% { fill: var(--c-green); } 63% { fill: var(--c-green); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-red); } }
    @keyframes s2 { 0% { fill: var(--c-green); } 56% { fill: var(--c-green); } 63% { fill: var(--c-green); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-green); } }
    @keyframes s3 { 0% { fill: var(--c-yellow); } 56% { fill: var(--c-yellow); } 63% { fill: var(--c-green); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-yellow); } }
    @keyframes s4 { 0% { fill: var(--c-blue); } 56% { fill: var(--c-blue); } 63% { fill: var(--c-white); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-blue); } }
    @keyframes s5 { 0% { fill: var(--c-white); } 56% { fill: var(--c-green); } 63% { fill: var(--c-green); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-white); } }
    @keyframes s6 { 0% { fill: var(--c-orange); } 56% { fill: var(--c-orange); } 63% { fill: var(--c-orange); } 70% { fill: var(--c-yellow); } 76% { fill: var(--c-green); } 98% { fill: var(--c-orange); } }
    @keyframes s7 { 0% { fill: var(--c-green); } 56% { fill: var(--c-green); } 63% { fill: var(--c-green); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-green); } }
    @keyframes s8 { 0% { fill: var(--c-orange); } 56% { fill: var(--c-orange); } 63% { fill: var(--c-red); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-orange); } }
    @keyframes s9 { 0% { fill: var(--c-blue); } 56% { fill: var(--c-red); } 63% { fill: var(--c-green); } 70% { fill: var(--c-green); } 76% { fill: var(--c-green); } 98% { fill: var(--c-blue); } }
    .st.s1 { animation-name: s1; }
    .st.s2 { animation-name: s2; }
    .st.s3 { animation-name: s3; }
    .st.s4 { animation-name: s4; }
    .st.s5 { animation-name: s5; }
    .st.s6 { animation-name: s6; }
    .st.s7 { animation-name: s7; }
    .st.s8 { animation-name: s8; }
    .st.s9 { animation-name: s9; }

    .face-frame {
        animation: solved var(--cycle) steps(1) infinite;
    }

    @keyframes solved {
        0%  { stroke: var(--line); }
        76% { stroke: var(--ok); }
        98% { stroke: var(--line); }
    }

    /* ---------- Légende ---------- */

    .label {
        position: relative;
        height: 1.4em;
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
    }

    .label span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: step var(--cycle) infinite;
    }

    .label span:nth-child(2) { animation-delay: calc(var(--cycle) * 0.25); }
    .label span:nth-child(3) { animation-delay: calc(var(--cycle) * 0.5); }
    .label span:nth-child(4) { animation-delay: calc(var(--cycle) * 0.75); color: var(--ok); }

    @keyframes step {
        0%        { opacity: 0; }
        3%, 21%   { opacity: 1; }
        25%, 100% { opacity: 0; }
    }

    /* Accessibilité : sans animation, on affiche le cube résolu */
    @media (prefers-reduced-motion: reduce) {
        .solve-btn, .bt-waves, .wave, .chip, .moves tspan, .wire, .rotor, .face,
        .st, .face-frame, .label span {
            animation: none;
        }
        .bt-waves { opacity: 0; }
        .moves tspan, .label span:nth-child(4) { opacity: 1; }
        .st { fill: var(--c-green); }
        .face-frame { stroke: var(--ok); }
    }
</style>
</head>
<body>

<div class="scene" role="img" aria-label="A smartphone sends a solve command over Bluetooth to a microcontroller board, which computes the moves and drives stepper motors until the Rubik's Cube face is solved.">

    <svg viewBox="0 0 280 120" aria-hidden="true">
        <!-- sol -->
        <line class="stroke dim" x1="0" y1="110" x2="280" y2="110"/>

        <!-- ===== Smartphone ===== -->
        <rect class="stroke" x="12" y="40" width="24" height="44" rx="3"/>
        <line class="stroke thin" x1="21" y1="44" x2="27" y2="44"/>
        <rect class="stroke thin solve-btn" x="15" y="58" width="18" height="9" rx="2"/>
        <text x="24" y="64.5" style="font-size:5px">SOLVE</text>
        <text x="24" y="98">app</text>

        <!-- ondes Bluetooth vers la carte -->
        <g class="bt-waves">
            <path class="stroke thin wave"    d="M40 58 Q43 62 40 66"/>
            <path class="stroke thin wave w2" d="M44 55 Q49 62 44 69"/>
            <path class="stroke thin wave w3" d="M48 52 Q55 62 48 72"/>
        </g>

        <!-- ===== Carte électronique (PCB) ===== -->
        <rect class="stroke" x="58" y="50" width="46" height="40" rx="2"/>
        <!-- module Bluetooth -->
        <rect class="stroke thin" x="61" y="53" width="12" height="7" rx="1"/>
        <text x="67" y="58.5" style="font-size:5px">BT</text>
        <!-- microcontrôleur -->
        <rect class="stroke thin chip" x="72" y="64" width="22" height="16"/>
        <text x="83" y="74.5" style="font-size:6px">MCU</text>
        <g class="stroke thin">
            <line x1="76" y1="61" x2="76" y2="64"/><line x1="81" y1="61" x2="81" y2="64"/>
            <line x1="86" y1="61" x2="86" y2="64"/><line x1="91" y1="61" x2="91" y2="64"/>
            <line x1="76" y1="80" x2="76" y2="83"/><line x1="81" y1="80" x2="81" y2="83"/>
            <line x1="86" y1="80" x2="86" y2="83"/><line x1="91" y1="80" x2="91" y2="83"/>
        </g>
        <text x="81" y="98">PCB</text>

        <!-- mouvements calculés par l'algorithme -->
        <text class="moves" x="198" y="24" style="font-size:9px">
            <tspan class="m1">R </tspan><tspan class="m2">U </tspan><tspan class="m3">R' </tspan><tspan class="m4">U'</tspan>
        </text>

        <!-- câbles carte → moteurs pas à pas -->
        <path class="wire" d="M104 62 L149 62"/>
        <path class="wire" d="M104 82 L130 82 L130 100 L191 100"/>
        <path class="wire" d="M205 100 L240 100 L240 69"/>

        <!-- ===== Moteurs pas à pas ===== -->
        <g>
            <circle class="stroke" cx="156" cy="62" r="7"/>
            <line class="stroke thin rotor" x1="156" y1="57" x2="156" y2="67"/>
        </g>
        <g>
            <circle class="stroke" cx="240" cy="62" r="7"/>
            <line class="stroke thin rotor" x1="240" y1="57" x2="240" y2="67"/>
        </g>
        <g>
            <circle class="stroke" cx="198" cy="100" r="7"/>
            <line class="stroke thin rotor" x1="198" y1="95" x2="198" y2="105"/>
        </g>

        <!-- ===== Face du Rubik's Cube ===== -->
        <g class="face">
            <rect class="stroke face-frame" x="169" y="33" width="58" height="58" rx="3"/>
            <rect class="st s1" x="172" y="36" width="16" height="16" rx="2"/>
            <rect class="st s2" x="190" y="36" width="16" height="16" rx="2"/>
            <rect class="st s3" x="208" y="36" width="16" height="16" rx="2"/>
            <rect class="st s4" x="172" y="54" width="16" height="16" rx="2"/>
            <rect class="st s5" x="190" y="54" width="16" height="16" rx="2"/>
            <rect class="st s6" x="208" y="54" width="16" height="16" rx="2"/>
            <rect class="st s7" x="172" y="72" width="16" height="16" rx="2"/>
            <rect class="st s8" x="190" y="72" width="16" height="16" rx="2"/>
            <rect class="st s9" x="208" y="72" width="16" height="16" rx="2"/>
        </g>
    </svg>

    <div class="label">
        <span>smartphone → Bluetooth</span><span>solving algorithm in C</span><span>stepper motors</span><span>cube solved ✓</span>
    </div>
</div>

</body>
</html>
