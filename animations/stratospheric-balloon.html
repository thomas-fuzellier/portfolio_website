<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stratospheric Balloon</title>
<style>
    :root {
        --bg: #000000;
        --line: #919191;
        --dim: #30363d;
        --signal: #58A6FF;
        --accent: #ffe600;
        --ok: #3FB950;
        --cycle: 8s;            
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        color: var(--line);
        font-family: monospace;
    }

    .scene {
        width: 280px;
    }

    .scene svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
    }

    .stroke {
        fill: none;
        stroke: var(--line);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .thin { stroke-width: 1; }
    .dim  { stroke: var(--dim); }

    text {
        font-family: monospace;
        fill: var(--line);
        font-size: 8px;
    }

    .balloon {
        animation: launch var(--cycle) ease-in-out infinite;
    }

    @keyframes launch {
        0%, 3%    { transform: translateY(48px); opacity: 1; }
        24%, 94%  { transform: translateY(0);    opacity: 1; }
        98%       { transform: translateY(0);    opacity: 0; }
        100%      { transform: translateY(48px); opacity: 0; }
    }

    .sway {
        transform-box: view-box;
        transform-origin: 180px 6px;
        animation: sway 3s ease-in-out infinite;
    }

    @keyframes sway {
        0%, 100% { transform: rotate(-2deg); }
        50%      { transform: rotate(2deg); }
    }

    .reading {
        fill: var(--accent);
        opacity: 0;
        animation: var(--cycle) infinite;
    }

    .reading.r1 { animation-name: read-1; }
    .reading.r2 { animation-name: read-2; }

    @keyframes read-1 { 0%, 27% { opacity: 0; } 30%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes read-2 { 0%, 34% { opacity: 0; } 37%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }

    .link {
        fill: none;
        stroke: var(--signal);
        stroke-width: 1.5;
        stroke-dasharray: 3 4;
        opacity: 0;
        animation: data 0.6s linear infinite, radio var(--cycle) infinite;
    }

    @keyframes data { to { stroke-dashoffset: 7; } }

    @keyframes radio {
        0%, 49%   { opacity: 0; }
        52%, 94%  { opacity: 1; }
        98%, 100% { opacity: 0; }
    }

    .wave {
        stroke: var(--signal);
        opacity: 0;
        animation: wave 1s ease-out infinite;
    }

    .wave.w2 { animation-delay: 0.5s; }

    @keyframes wave {
        0%   { opacity: 0.9; }
        100% { opacity: 0; }
    }

    .waves {
        opacity: 0;
        animation: radio var(--cycle) infinite;
    }

    .screen {
        animation: screen var(--cycle) steps(1) infinite;
    }

    @keyframes screen {
        0%   { stroke: var(--line); }
        52%  { stroke: var(--signal); }
        77%  { stroke: var(--ok); }
        98%  { stroke: var(--line); }
    }

    .fov {
        fill: var(--signal);
        opacity: 0;
        animation: fov var(--cycle) infinite;
    }

    @keyframes fov {
        0%, 75%   { opacity: 0; }
        77%       { opacity: 0.45; }   
        80%, 94%  { opacity: 0.15; }
        98%, 100% { opacity: 0; }
    }

    .photo {
        opacity: 0;
        animation: photo var(--cycle) infinite;
    }

    @keyframes photo {
        0%, 78%   { opacity: 0; }
        81%, 94%  { opacity: 1; }
        98%, 100% { opacity: 0; }
    }

    .photo path { stroke: var(--ok); }

    .label {
        position: relative;
        height: 1.4em;
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
    }

    .label span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: step var(--cycle) infinite;
    }

    .label span:nth-child(2) { animation-delay: calc(var(--cycle) * 0.25); }
    .label span:nth-child(3) { animation-delay: calc(var(--cycle) * 0.5); }
    .label span:nth-child(4) { animation-delay: calc(var(--cycle) * 0.75); color: var(--ok); }

    @keyframes step {
        0%        { opacity: 0; }
        3%, 21%   { opacity: 1; }
        25%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .balloon, .sway, .reading, .link, .wave, .waves, .screen, .fov, .photo, .label span {
            animation: none;
        }
        .reading, .link, .photo, .label span:nth-child(4) { opacity: 1; }
        .fov { opacity: 0.15; }
    }
</style>
</head>
<body>

<div class="scene" role="img" aria-label="A stratospheric balloon rises, its payload sends sensor data to a ground station and photographs the Earth.">

    <svg viewBox="0 0 280 120" aria-hidden="true">

        <path class="stroke dim" d="M0 112 Q140 104 280 112"/>

        <path class="stroke" d="M22 74 Q30 90 46 86"/>
        <line class="stroke thin" x1="34" y1="84" x2="40" y2="78"/>
        <circle cx="41" cy="77" r="1.5" fill="#919191"/>
        <line class="stroke" x1="34" y1="84" x2="34" y2="108"/>
        <line class="stroke" x1="26" y1="108" x2="42" y2="108"/>
        <g class="waves">
            <path class="stroke thin wave"    d="M46 72 Q50 76 48 81"/>
            <path class="stroke thin wave w2" d="M50 68 Q56 75 53 83"/>
        </g>
        <rect class="stroke thin screen" x="58" y="84" width="26" height="18" rx="1"/>
        <line class="stroke thin" x1="71" y1="102" x2="71" y2="108"/>
        <line class="stroke thin" x1="64" y1="108" x2="78" y2="108"/>
        <g class="photo">
            <path class="stroke thin" d="M61 99 L67 91 L71 96 L75 89 L81 99"/>
        </g>
        <text x="40" y="119" text-anchor="middle">ground station</text>

        <g class="balloon">
            <path class="fov" d="M180 62 L150 110 L210 110 Z"/>

            <path class="link" d="M172 56 Q110 50 48 74"/>

            <g class="sway">
                <path class="stroke" d="M180 6 C200 6 202 30 186 40 L180 44 L174 40 C158 30 160 6 180 6 Z"/>
                <line class="stroke thin" x1="180" y1="44" x2="174" y2="50"/>
                <line class="stroke thin" x1="180" y1="44" x2="186" y2="50"/>
                <rect class="stroke" x="172" y="50" width="16" height="10" rx="1"/>
                <circle class="stroke thin" cx="180" cy="62" r="2"/>
                <line class="stroke thin" x1="172" y1="52" x2="168" y2="48"/>
            </g>

            <text class="reading r1" x="196" y="52">alt 30 km</text>
            <text class="reading r2" x="196" y="62">-56 °C</text>
        </g>
    </svg>

    <div class="label">
        <span>launch: payload &amp; PCB</span><span>sensor data acquisition</span><span>ground control link</span><span>earth observation ✓</span>
    </div>
</div>

</body>
</html>
