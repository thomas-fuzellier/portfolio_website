<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevator Firmware</title>
<style>
    :root {
        --bg: #000000;
        --line: #919191;
        --dim: #30363d;
        --signal: #58A6FF;
        --ok: #3FB950;
        --cycle: 8s;            
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        color: var(--line);
        font-family: monospace;
    }

    .scene {
        width: 280px;
    }

    .scene svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
    }

    .stroke {
        fill: none;
        stroke: var(--line);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .thin {
        stroke-width: 1;
    }

    .dim {
        stroke: var(--dim);
    }

    .chip-text, .display {
        font-family: monospace;
        text-anchor: middle;
    }

    .chip-text {
        font-size: 8px;
        fill: var(--line);
    }

    .screen {
        animation: typing 0.8s steps(1) infinite;
    }

    @keyframes typing {
        0%   { fill: var(--dim); }
        50%  { fill: var(--signal); }
    }

    .wire {
        fill: none;
        stroke: var(--signal);
        stroke-width: 1.5;
        stroke-dasharray: 3 5;
        animation: data 0.6s linear infinite;
    }

    @keyframes data {
        to { stroke-dashoffset: -8; }
    }


    .cabin {
        animation: ride var(--cycle) ease-in-out infinite;
    }

    @keyframes ride {
        0%, 10%   { transform: translateY(0); }
        22%, 35%  { transform: translateY(-30px); }
        47%, 62%  { transform: translateY(-60px); }
        84%, 100% { transform: translateY(0); }
    }

    .door-l, .door-r {
        transform-box: fill-box;
        animation: doors var(--cycle) infinite;
    }
    .door-l { transform-origin: left center; }
    .door-r { transform-origin: right center; }

    @keyframes doors {
        0%, 2%, 9%, 23%, 34%, 48%, 61%, 85%, 100% { transform: scaleX(1); }
        4%, 7%, 26%, 31%, 51%, 58%, 88%, 97%      { transform: scaleX(0.35); }
    }

    .sensor {
        fill: var(--dim);
        animation: var(--cycle) steps(1) infinite;
    }

    .sensor.f0 { animation-name: at-f0; }
    .sensor.f1 { animation-name: at-f1; }
    .sensor.f2 { animation-name: at-f2; }

    @keyframes at-f0 {
        0%   { fill: var(--ok); }
        11%  { fill: var(--dim); }
        84%  { fill: var(--ok); }
    }
    @keyframes at-f1 {
        0%   { fill: var(--dim); }
        22%  { fill: var(--ok); }
        36%  { fill: var(--dim); }
    }
    @keyframes at-f2 {
        0%   { fill: var(--dim); }
        47%  { fill: var(--ok); }
        63%  { fill: var(--dim); }
    }

    .display {
        font-size: 11px;
        font-weight: bold;
        fill: var(--ok);
        opacity: 0;
        animation: var(--cycle) steps(1) infinite;
    }

    .display.f0 { animation-name: show-f0; }
    .display.f1 { animation-name: show-f1; }
    .display.f2 { animation-name: show-f2; }

    @keyframes show-f0 { 0% { opacity: 1; } 16% { opacity: 0; } 73% { opacity: 1; } }
    @keyframes show-f1 { 0% { opacity: 0; } 16% { opacity: 1; } 41% { opacity: 0; } }
    @keyframes show-f2 { 0% { opacity: 0; } 41% { opacity: 1; } 73% { opacity: 0; } }

    .label {
        position: relative;
        height: 1.4em;
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
    }

    .label span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: step var(--cycle) infinite;
    }

    .label span:nth-child(2) { animation-delay: calc(var(--cycle) * 0.25); }
    .label span:nth-child(3) { animation-delay: calc(var(--cycle) * 0.5); }
    .label span:nth-child(4) { animation-delay: calc(var(--cycle) * 0.75); color: var(--ok); }

    @keyframes step {
        0%        { opacity: 0; }
        3%, 21%   { opacity: 1; }
        25%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .screen, .wire, .cabin, .door-l, .door-r, .sensor, .display, .label span {
            animation: none;
        }
        .sensor.f0 { fill: var(--ok); }
        .display.f0, .label span:nth-child(4) { opacity: 1; }
    }
</style>
</head>
<body>

<div class="scene" role="img" aria-label="An engineer with a laptop next to a microcontroller board driving an elevator between floors.">

    <svg viewBox="0 0 280 120" aria-hidden="true">
        <line class="stroke dim" x1="0" y1="110" x2="280" y2="110"/>

        <circle class="stroke" cx="40" cy="58" r="8"/>
        <line class="stroke" x1="40" y1="66" x2="40" y2="88"/>
        <polyline class="stroke" points="40,72 52,78"/>
        <polyline class="stroke" points="40,72 48,82 54,80"/>
        <line class="stroke" x1="40" y1="88" x2="33" y2="110"/>
        <line class="stroke" x1="40" y1="88" x2="47" y2="110"/>
        <rect class="screen" x="52" y="68" width="14" height="10" rx="1" stroke="#919191" stroke-width="1.5"/>
        <line class="stroke" x1="50" y1="80" x2="68" y2="80"/>

        <path class="stroke dim thin" d="M68 80 Q78 80 84 86"/>

        <rect class="stroke" x="84" y="76" width="40" height="28" rx="2"/>
        <rect class="stroke thin" x="94" y="83" width="20" height="14"/>
        <text class="chip-text" x="104" y="93">MCU</text>
        <g class="stroke thin">
            <line x1="97" y1="80" x2="97" y2="83"/><line x1="102" y1="80" x2="102" y2="83"/>
            <line x1="107" y1="80" x2="107" y2="83"/><line x1="112" y1="80" x2="112" y2="83"/>
            <line x1="97" y1="97" x2="97" y2="100"/><line x1="102" y1="97" x2="102" y2="100"/>
            <line x1="107" y1="97" x2="107" y2="100"/><line x1="112" y1="97" x2="112" y2="100"/>
        </g>
        <line class="stroke thin" x1="88" y1="104" x2="88" y2="110"/>
        <line class="stroke thin" x1="120" y1="104" x2="120" y2="110"/>

        <path class="wire" d="M124 84 L150 84 L150 24 L168 24"/>
        <path class="wire" d="M124 96 L168 96"/>

        <rect class="stroke" x="168" y="18" width="56" height="92"/>
        <line class="stroke dim thin" x1="168" y1="80" x2="224" y2="80"/>
        <line class="stroke dim thin" x1="168" y1="50" x2="224" y2="50"/>
        <line class="stroke dim thin" x1="196" y1="18" x2="196" y2="84"/>

        <g class="cabin">
            <rect class="stroke" x="178" y="84" width="36" height="24" rx="1" fill="#000"/>
            <rect class="door-l stroke thin" x="181" y="87" width="15" height="18"/>
            <rect class="door-r stroke thin" x="196" y="87" width="15" height="18"/>
        </g>

        <circle class="sensor f2" cx="232" cy="34" r="3"/>
        <circle class="sensor f1" cx="232" cy="64" r="3"/>
        <circle class="sensor f0" cx="232" cy="94" r="3"/>

        <rect class="stroke thin" x="186" y="2" width="20" height="13" rx="2"/>
        <text class="display f0" x="196" y="12">0</text>
        <text class="display f1" x="196" y="12">1</text>
        <text class="display f2" x="196" y="12">2</text>
    </svg>

    <div class="label">
        <span>embedded C/C++</span><span>sensor drivers</span><span>python test tools</span><span>all floors OK ✓</span>
    </div>
</div>

</body>
</html>
